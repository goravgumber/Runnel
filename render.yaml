# ==============================================================================
# Runnel - Render Blueprint Specification (render.yaml)
# Zero-cost portfolio deployment topology:
# - runnel-backend: Free Web Service (Node.js API + Socket.IO + BullMQ Worker)
# - runnel-frontend: Free Static Site (Vite Single Page Application)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: runnel-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      # Atlas MongoDB connection string (set manually in Render Dashboard or CLI)
      - key: MONGO_URI
        sync: false
      # Upstash native Redis TCP/TLS URL (rediss://default:password@endpoint:port)
      - key: REDIS_URL
        sync: false
      # High-entropy production JWT secret (auto-generated by Render)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Deployed frontend origin (e.g. https://runnel-frontend-xxxx.onrender.com)
      - key: FRONTEND_URL
        sync: false
      # Backend public URL (e.g. https://runnel-backend-xxxx.onrender.com)
      - key: PUBLIC_API_URL
        sync: false
      - key: ENABLE_DEMO_HANDLERS
        value: "false"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "1000"
      - key: EXECUTION_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: EXECUTION_RATE_LIMIT_MAX
        value: "60"
      - key: MAX_CONCURRENT_EXECUTIONS_PER_USER
        value: "25"
      - key: MAX_PAYLOAD_SIZE
        value: 2mb
      - key: WEBHOOK_REQUEST_TIMEOUT_MS
        value: "10000"
      - key: WEBHOOK_CONNECT_TIMEOUT_MS
        value: "5000"
      - key: WEBHOOK_MAX_REDIRECTS
        value: "3"
      - key: WEBHOOK_MAX_RESPONSE_BYTES
        value: "1048576"
      - key: RECOVERY_ENABLED
        value: "true"
      - key: RECOVERY_INTERVAL_MS
        value: "60000"
      - key: RECOVERY_STALE_THRESHOLD_MS
        value: "300000"
      - key: RECOVERY_LOCK_TTL_MS
        value: "30000"
      - key: RECOVERY_BATCH_SIZE
        value: "50"

  # ----------------------------------------------------------------------------
  # 2. Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: static
    name: runnel-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # SPA rewrite rule: route all HTML requests to index.html for client-side routing
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Backend API Base URL (must be set before build, e.g. https://runnel-backend-xxxx.onrender.com)
      - key: VITE_API_URL
        sync: false
      # Socket.IO Gateway URL (defaults to origin of VITE_API_URL if omitted)
      - key: VITE_SOCKET_URL
        sync: false
      - key: VITE_ENABLE_DEMO_DISPATCHER
        value: "false"
