services:
  mongodb:
    image: mongo:8.0
    container_name: runnel_mongodb_dev
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_dev:/data/db

  redis:
    image: redis:7.4-alpine
    container_name: runnel_redis_dev
    ports:
      - "6380:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: runnel_backend_dev
    command: npm run dev
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/runnel
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=development_fallback_secret_key_9999
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: runnel_frontend_dev
    # Override standard nginx web serving to run development server
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - backend

volumes:
  mongodb_data_dev:
